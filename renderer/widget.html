<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0;
    width: 64px;
    height: 64px;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .wrap {
    position: relative;
    width: 64px;
    height: 64px;
  }

  .btn {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #2F6FED;
    box-shadow: 0 8px 20px -6px rgba(30, 63, 130, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    clip-path: circle(50%);
  }

  .btn svg {
    width: 26px;
    height: 22px;
    color: #ffffff;
    pointer-events: none;
  }

  .close {
    position: absolute;
    top: 0;
    right: 0;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #ffffff;
    color: #5B6B85;
    border: 1px solid #D8E6F7;
    font-size: 11px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .wrap:hover .close { display: flex; }
  .close:hover { color: #C0392B; border-color: #C0392B; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="btn" id="btn" title="Abrir Ateliê Azul">
      <svg viewBox="0 0 120 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 30 L20 10 L42 24" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M90 30 L100 10 L78 24" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
        <ellipse cx="60" cy="52" rx="34" ry="28" stroke="currentColor" stroke-width="6"/>
        <circle cx="49" cy="48" r="4" fill="currentColor"/>
        <circle cx="71" cy="48" r="4" fill="currentColor"/>
        <path d="M60 61 Q60 67 53 67" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="close" id="close" title="Esconder o botãozinho flutuante">✕</div>
  </div>

<script>
  const btn = document.getElementById('btn');
  const closeBtn = document.getElementById('close');

  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    window.widgetApi.close();
  });

  let dragging = false;
  let moved = 0;
  let pendingDx = 0, pendingDy = 0, rafScheduled = false;

  function flushDrag() {
    rafScheduled = false;
    if (!pendingDx && !pendingDy) return;
    const dx = pendingDx, dy = pendingDy;
    pendingDx = 0; pendingDy = 0;
    window.widgetApi.dragBy(dx, dy);
  }

  btn.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    moved = 0;
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    if (e.movementX || e.movementY) {
      moved += Math.abs(e.movementX) + Math.abs(e.movementY);
      pendingDx += e.movementX;
      pendingDy += e.movementY;
      if (!rafScheduled) {
        rafScheduled = true;
        requestAnimationFrame(flushDrag);
      }
    }
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    if (moved < 4) window.widgetApi.clicked();
  });
</script>
</body>
</html>
